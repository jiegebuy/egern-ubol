name: "📺 BiliBili: 🛡️ ADBlock + BBZQ"
description: "Egern 版哔哩哔哩广告净化；基于 BiliUniverse ADBlock，并补充 BBZQ 风格的首页卡片与标题关键词过滤。"
author: "BiliUniverse; BBZQ; Egern port by jiegebuy"
homepage: "https://github.com/BiliUniverse/ADBlock"
manual: "https://github.com/jiegebuy/egern-ubol/tree/main/bilibili"
icon: "https://github.com/BiliUniverse/ADBlock/raw/main/src/assets/icon_rounded.png"

compat_arguments:
  Splash: "true"
  Feed.AD: "true"
  Feed.Activity: "false"
  Feed.Vertical: "false"
  Feed.BlockUpLiveList: ""
  Feed.Story: "true"
  Feed.Filter: "false"
  Feed.FilterTypes: "picture,game,live,ketang,vertical,large"
  Feed.TitleKeywords: ""
  Search.AD: "true"
  Search.HotSearch: "true"
  PGC.AD: "true"
  Xlive.AD: "true"
  Dynamic.HotTopics: "true"
  Dynamic.MostVisited: "false"
  Dynamic.MostVisitedLiveOnly: "false"
  Dynamic.AdCard: "true"
  View.AD: "true"
  DM.Command: "false"
  DM.Colorful: "false"
  Reply.AD: "true"
  LogLevel: "WARN"

compat_arguments_desc: |
  Splash: 去除开屏广告。
  Feed.AD: 去除首页推荐广告。
  Feed.Activity: 去除推荐页活动大图。
  Feed.Vertical: 去除推荐页竖屏视频。
  Feed.BlockUpLiveList: 屏蔽指定 UP 主的直播推广，多个 UID 用英文逗号分隔。
  Feed.Story: 去除首页短视频流广告。
  Feed.Filter: 启用 BBZQ 风格的额外首页卡片过滤。
  Feed.FilterTypes: 可选 picture、game、live、ketang、vertical、large，用英文逗号分隔。
  Feed.TitleKeywords: 标题关键词黑名单，支持英文逗号、中文逗号或换行分隔。
  Search.AD: 去除搜索广告。
  Search.HotSearch: 去除热搜和推荐搜索词。
  PGC.AD: 去除番剧、影视页广告。
  Xlive.AD: 去除直播页广告。
  Dynamic.HotTopics: 去除动态页热门话题。
  Dynamic.MostVisited: 去除动态页最常访问。
  Dynamic.MostVisitedLiveOnly: 最常访问只保留直播。
  Dynamic.AdCard: 去除动态广告卡片。
  View.AD: 去除视频详情页广告和商业推广组件。
  暂停广告拦截为模块的固定功能：拒绝广告配置域名，并对明确的 pause/paused/pause_page 类接口返回空数据。
  DM.Command: 去除互动式弹幕。
  DM.Colorful: 替换彩色弹幕。
  Reply.AD: 去除评论区广告卡片。
  LogLevel: OFF、ERROR、WARN、INFO、DEBUG 或 ALL。

rules:
  - domain:
      match: cm.bilibili.com
      policy: REJECT
  - domain:
      match: cm.biliapi.net
      policy: REJECT
  - url_regex:
      match: '^https?:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.app\.interface\.v1\.Search\/DefaultWords$'
      policy: REJECT

body_rewrites:
  - match: '^https:\/\/api\.bilibili\.com\/pgc\/view\/v2\/app\/season\?'
    find: '"payment":\{[^{}]*\},?'
    replace: ""
    type: response

scriptings:
  - http_request:
      name: "BiliBili ADBlock 本地空响应"
      match: '^https?:\/\/(api\.vc\.bilibili\.com\/(search_svr\/v\d+\/Search\/recommend_words|topic_svr\/v1\/topic_svr|dynamic_svr\/v1\/dynamic_svr\/mix_uplist)|manga\.bilibili\.com\/twirp\/comic\.v\d+\.Comic\/(Flash|ListFlash)|api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v1\/ecommerce-user\/get_shopping_info\?|api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive\?|(?:api|app)\.bili(bili\.com|api\.net)\/.*(?:pause|paused|pause_page|paused_page|pausedpage|pause_ad|ad_pause)(?:\/|\?|$))'
      script_url: "https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/bilibili/scripts/static-response.js"
      update_interval: 86400
      timeout: 10
  - http_request:
      name: "BiliBili ADBlock 推荐请求"
      match: '^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/v2\/feed\/index\?'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/request.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'Splash="{{{Splash}}}"&Feed.AD="{{{Feed.AD}}}"&Feed.Activity="{{{Feed.Activity}}}"&Feed.Vertical="{{{Feed.Vertical}}}"&Feed.BlockUpLiveList="{{{Feed.BlockUpLiveList}}}"&Feed.Story="{{{Feed.Story}}}"&Search.AD="{{{Search.AD}}}"&Search.HotSearch="{{{Search.HotSearch}}}"&PGC.AD="{{{PGC.AD}}}"&Xlive.AD="{{{Xlive.AD}}}"&Dynamic.HotTopics="{{{Dynamic.HotTopics}}}"&Dynamic.MostVisited="{{{Dynamic.MostVisited}}}"&Dynamic.MostVisitedLiveOnly="{{{Dynamic.MostVisitedLiveOnly}}}"&Dynamic.AdCard="{{{Dynamic.AdCard}}}"&View.AD="{{{View.AD}}}"&DM.Command="{{{DM.Command}}}"&DM.Colorful="{{{DM.Colorful}}}"&Reply.AD="{{{Reply.AD}}}"&LogLevel="{{{LogLevel}}}"'
  - http_response:
      name: "BiliBili ADBlock JSON"
      match: '^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/v2\/(splash\/(brand\/list|event\/list2|list|show)|feed\/index(\/story)?|search\/square)'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'Splash="{{{Splash}}}"&Feed.AD="{{{Feed.AD}}}"&Feed.Activity="{{{Feed.Activity}}}"&Feed.Vertical="{{{Feed.Vertical}}}"&Feed.BlockUpLiveList="{{{Feed.BlockUpLiveList}}}"&Feed.Story="{{{Feed.Story}}}"&Search.AD="{{{Search.AD}}}"&Search.HotSearch="{{{Search.HotSearch}}}"&PGC.AD="{{{PGC.AD}}}"&Xlive.AD="{{{Xlive.AD}}}"&Dynamic.HotTopics="{{{Dynamic.HotTopics}}}"&Dynamic.MostVisited="{{{Dynamic.MostVisited}}}"&Dynamic.MostVisitedLiveOnly="{{{Dynamic.MostVisitedLiveOnly}}}"&Dynamic.AdCard="{{{Dynamic.AdCard}}}"&View.AD="{{{View.AD}}}"&DM.Command="{{{DM.Command}}}"&DM.Colorful="{{{DM.Colorful}}}"&Reply.AD="{{{Reply.AD}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
  - http_response:
      name: "BiliBili ADBlock 首页附加过滤"
      match: '^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/v2\/feed\/index\?'
      script_url: "https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/bilibili/scripts/feed-filter.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'Feed.Filter="{{{Feed.Filter}}}"&Feed.FilterTypes="{{{Feed.FilterTypes}}}"&Feed.TitleKeywords="{{{Feed.TitleKeywords}}}"'
      body_required: true
      max_size: 1048576
  - http_response:
      name: "BiliBili ADBlock Web 推荐"
      match: '^https?:\/\/api\.bilibili\.com\/x\/web-interface\/wbi\/index\/top\/feed\/rcmd\?'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'Feed.AD="{{{Feed.AD}}}"&Feed.Activity="{{{Feed.Activity}}}"&Feed.Vertical="{{{Feed.Vertical}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
  - http_response:
      name: "BiliBili ADBlock PGC 页面"
      match: '^https?:\/\/api\.bili(bili\.com|api\.net)\/pgc\/page\/(bangumi|cinema\/tab\?)'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'PGC.AD="{{{PGC.AD}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
  - http_response:
      name: "BiliBili ADBlock 直播间"
      match: '^https?:\/\/api\.live\.bilibili\.com\/xlive\/app-room\/v1\/index\/getInfoByRoom'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'Xlive.AD="{{{Xlive.AD}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
  - http_response:
      name: "BiliBili ADBlock 视频详情 gRPC"
      match: '^https?:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.app\.(view|viewunite)\.v1\.View\/(View|TFInfo|RelatesFeed)$'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'View.AD="{{{View.AD}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
      binary_body: true
      max_size: 262144
  - http_response:
      name: "BiliBili ADBlock 动态 gRPC"
      match: '^https?:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.app\.dynamic\.v2\.Dynamic\/Dyn(All|Video)$'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'Dynamic.HotTopics="{{{Dynamic.HotTopics}}}"&Dynamic.MostVisited="{{{Dynamic.MostVisited}}}"&Dynamic.MostVisitedLiveOnly="{{{Dynamic.MostVisitedLiveOnly}}}"&Dynamic.AdCard="{{{Dynamic.AdCard}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
      binary_body: true
  - http_response:
      name: "BiliBili ADBlock 播放地址 gRPC"
      match: '^https?:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.app\.playurl\.v1\.PlayURL\/PlayView$'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'View.AD="{{{View.AD}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
      binary_body: true
  - http_response:
      name: "BiliBili ADBlock 搜索 gRPC"
      match: '^https?:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.polymer\.app\.search\.v1\.Search\/SearchAll$'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'Search.AD="{{{Search.AD}}}"&Search.HotSearch="{{{Search.HotSearch}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
      binary_body: true
  - http_response:
      name: "BiliBili ADBlock 弹幕 gRPC"
      match: '^https:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.community\.service\.dm\.v1\.DM\/(DmView|DmSegMobile)'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'DM.Command="{{{DM.Command}}}"&DM.Colorful="{{{DM.Colorful}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
      binary_body: true
  - http_response:
      name: "BiliBili ADBlock 青少年模式 gRPC"
      match: '^https:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.app\.interface\.v1\.Teenagers\/ModeStatus'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'Splash="{{{Splash}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
      binary_body: true
  - http_response:
      name: "BiliBili ADBlock 评论 gRPC"
      match: '^https:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.main\.community\.reply\.v1\.Reply\/MainList'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'Reply.AD="{{{Reply.AD}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
      binary_body: true
  - http_response:
      name: "BiliBili ADBlock PGC 播放 gRPC"
      match: '^https:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.pgc\.gateway\.player\.v2\.PlayURL\/PlayView$'
      script_url: "https://github.com/BiliUniverse/ADBlock/releases/latest/download/response.bundle.js"
      update_interval: 86400
      arguments:
        _compat.$argument: 'PGC.AD="{{{PGC.AD}}}"&LogLevel="{{{LogLevel}}}"'
      body_required: true
      binary_body: true

mitm:
  hostnames:
    includes:
      - manga.bilibili.com
      - api.live.bilibili.com
      - api.vc.bilibili.com
      - app.bilibili.com
      - app.biliapi.net
      - api.bilibili.com
      - api.biliapi.net
      - grpc.bilibili.com
      - grpc.biliapi.net
  h2: true
