name: '🍿️ DualSubs: ▶️ YouTube'
description: YouTube 增强及双语字幕(歌词)，支持 DeepLX 与 Gemini AI Studio 翻译
compat_arguments:
  Type: '"Translate"'
  Types: '"Translate"'
  AutoCC: 'true'
  Position: '"Forward"'
  Vendor: '"DeepLX"'
  DeepLXEndpoint: '""'
  DeepLXToken: '""'
  GeminiAPIKey: '""'
  GeminiModel: '"gemini-3.7-flash"'
  ShowOnly: 'false'
  LogLevel: '"WARN"'
compat_arguments_desc: |
  Type: [字幕] 启用类型，建议选择 Translate；检测到自带英/中轨道时会自动改用官方合成。
  Types: [歌词] 启用类型。
  AutoCC: [字幕] 是否自动显示。
  Position: [字幕] Forward 为原文在上，Reverse 为译文在上。
  Vendor: [翻译器] 支持 Google、Microsoft、DeepL、DeepLX、Gemini。
  DeepLXEndpoint: DeepLX 服务地址，可填写服务根地址或完整 /translate 地址，不要附加查询参数。
  DeepLXToken: api.deeplx.org 填 API Key；其他服务可填 Bearer Token；完整路径已含 Key 时留空。
  GeminiAPIKey: Google AI Studio API Key，仅在 Vendor=Gemini 时使用。
  GeminiModel: Gemini 模型 ID，默认 gemini-3.7-flash，也可填写其他 generateContent 模型。
  ShowOnly: 机器翻译时是否只显示译文；命中自带英中轨道时始终合成双语。
  LogLevel: OFF、ERROR、WARN、INFO、DEBUG 或 ALL。
open_url: http://boxjs.com/#/app/DualSubs.YouTube
author: VirgilClyne[https://github.com/VirgilClyne]; DeepLX patch by Codex
homepage: https://DualSubs.github.io/guide/youtube
icon: https://github.com/DualSubs/YouTube/raw/main/src/assets/icon_rounded.png
rules:
- url_regex:
    match: ^https?:\/\/([\w-]+)\.googlevideo\.com\/initplayback(\?.*oad=.+)$
    policy: REJECT
scriptings:
- http_request:
    name: 🍿️ DualSubs.YouTube.Player.request.json
    match: ^https?:\/\/(www|m|tv)\.youtube\.com\/youtubei\/v1\/player(\?.+)?$
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/YouTube.request.official.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_response:
    name: 🍿️ DualSubs.YouTube.Player.response.json
    match: ^https?:\/\/(www|m|tv)\.youtube\.com\/youtubei\/v1\/player(\?.+)?$
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/YouTube.response.official.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_request:
    name: 🍿️ DualSubs.YouTube.Player.request.proto
    match: ^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/player(\?.+)?$
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/YouTube.request.official.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
    binary_body: true
- http_response:
    name: 🍿️ DualSubs.YouTube.Player.response.proto
    match: ^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/player(\?.+)?$
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/YouTube.response.official.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
    binary_body: true
- http_response:
    name: 🍿️ DualSubs.YouTube.GetWatch.response.proto
    match: ^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/get_watch(\?.+)?$
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/YouTube.response.official.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
    binary_body: true
- http_request:
    name: 🍿️ DualSubs.YouTube.TimedText.request
    match: ^https?:\/\/(www|m)\.youtube\.com\/api\/timedtext(\?.+)?$
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/YouTube.request.official.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
- http_response:
    name: 🍿️ DualSubs.YouTube.Composite.TimedText.response
    match: ^https?:\/\/(www|m)\.youtube\.com\/api\/timedtext\?(.*)subtype=(Official|External)
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/Composite.Subtitles.response.official.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_response:
    name: 🍿️ DualSubs.YouTube.Translate.TimedText.response
    match: ^https?:\/\/(www|m)\.youtube\.com\/api\/timedtext\?(.*)subtype=Translate
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/Translate.response.deeplx.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&DeepLX.Endpoint="{{{DeepLXEndpoint}}}"&DeepLX.Auth="{{{DeepLXToken}}}"&Gemini.Key="{{{GeminiAPIKey}}}"&Gemini.Model="{{{GeminiModel}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_request:
    name: 🍿️ DualSubs.YouTubeMusic.Browse.request.json
    match: ^https?:\/\/music\.youtube\.com\/youtubei\/v1\/browse(\?.+)?$
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/YouTube.request.official.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_request:
    name: 🍿️ DualSubs.YouTube.Browse.request.proto
    match: ^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/browse(\?.+)?$
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/YouTube.request.official.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
    binary_body: true
- http_response:
    name: 🍿️ DualSubs.YouTubeMusic.Translate.Lyrics.response.json
    match: ^https?:\/\/music\.youtube\.com\/youtubei\/v1\/browse\?(.*)subtype=Translate
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/Translate.response.deeplx.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&DeepLX.Endpoint="{{{DeepLXEndpoint}}}"&DeepLX.Auth="{{{DeepLXToken}}}"&Gemini.Key="{{{GeminiAPIKey}}}"&Gemini.Model="{{{GeminiModel}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_response:
    name: 🍿️ DualSubs.YouTubeMusic.Translate.Lyrics.response.proto
    match: ^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/browse\?(.*)subtype=Translate
    script_url: https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/deeplx/Translate.response.deeplx.bundle.js
    arguments:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&DeepLX.Endpoint="{{{DeepLXEndpoint}}}"&DeepLX.Auth="{{{DeepLXToken}}}"&Gemini.Key="{{{GeminiAPIKey}}}"&Gemini.Model="{{{GeminiModel}}}"&ShowOnly="{{{ShowOnly}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
    binary_body: true
mitm:
  hostnames:
    includes:
    - www.youtube.com
    - m.youtube.com
    - tv.youtube.com
    - music.youtube.com
    - youtubei.googleapis.com
    - -redirector*.googlevideo.com
    - '*.googlevideo.com'
