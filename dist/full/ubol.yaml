name: "uBlock Origin Lite rules"
description: "One Egern module with 56 independently configurable uBO Lite 2026.729.1529 filter-list switches (full URL profile)."
author: "Raymond Hill and upstream filter-list maintainers"
homepage: "https://github.com/uBlockOrigin/uBOL-home"
manual: "https://github.com/uBlockOrigin/uBOL-home"
icon: "shield.lefthalf.filled"

compat_arguments:
  BLOCK_POLICY: "REJECT"
  DISABLE_UBLOCK_FILTERS: false
  DISABLE_EASYLIST: false
  DISABLE_EASYPRIVACY: false
  DISABLE_PGL: false
  DISABLE_UBLOCK_BADWARE: false
  DISABLE_URLHAUS_FULL: false
  DISABLE_ADGUARD_MOBILE: true
  DISABLE_BLOCK_LAN: true
  DISABLE_ADGUARD_SPYWARE_URL: false
