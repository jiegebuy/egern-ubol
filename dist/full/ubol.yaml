  DISABLE_ANNOYANCES_SOCIAL: true
  DISABLE_ANNOYANCES_WIDGETS: true
  DISABLE_ANNOYANCES_OTHERS: true
  DISABLE_ANNOYANCES_NOTIFICATIONS: true
  DISABLE_UBLOCK_EXPERIMENTAL: true
  DISABLE_UBOL_TESTS: true
  DISABLE_ALB_0: true
  DISABLE_ARA_0: true
  DISABLE_BGR_0: true
  DISABLE_CHN_0: false
  DISABLE_CZE_0: true
  DISABLE_DEU_0: true
  DISABLE_EST_0: true
  DISABLE_FIN_0: true
  DISABLE_FRA_0: true
  DISABLE_GRC_0: true
  DISABLE_HRV_0: true
  DISABLE_HUN_0: true
  DISABLE_IDN_0: true
  DISABLE_IND_0: true
  DISABLE_IRN_0: true
  DISABLE_ISL_0: true
  DISABLE_ISR_0: true
  DISABLE_ITA_0: true
  DISABLE_JPN_1: true
  DISABLE_KOR_1: true
  DISABLE_LTU_0: true
  DISABLE_LVA_0: true
  DISABLE_MKD_0: true
  DISABLE_NLD_0: true
  DISABLE_NOR_0: true
  DISABLE_POL_0: true
  DISABLE_POL_3: true
  DISABLE_ROU_1: true
  DISABLE_RUS_0: true
  DISABLE_RUS_1: true
  DISABLE_SPA_0: true
  DISABLE_SPA_1: true
  DISABLE_SVN_0: true
  DISABLE_SWE_1: true
  DISABLE_THA_0: true
  DISABLE_TUR_0: true
  DISABLE_UKR_0: true
  DISABLE_VIE_1: true
compat_arguments_desc: |
  Set a DISABLE_* boolean to false to enable that list, or true to disable it.
  BLOCK_POLICY controls the Egern policy used by all enabled lists.
  [Default]
  DISABLE_UBLOCK_FILTERS: uBlock filters – Ads, trackers, and more
  DISABLE_EASYLIST: EasyList
  DISABLE_EASYPRIVACY: EasyPrivacy
  DISABLE_PGL: Peter Lowe – Ads, trackers, and more
  [Ads]
  DISABLE_ADGUARD_MOBILE: AdGuard/uBO – Mobile Ads
  [Privacy]
  DISABLE_BLOCK_LAN: Block Outsider Intrusion into LAN
  DISABLE_ADGUARD_SPYWARE_URL: AdGuard/uBO – URL Tracking Protection
  [Malware protection, security]
  DISABLE_UBLOCK_BADWARE: uBlock filters – Badware risks
  DISABLE_URLHAUS_FULL: Malicious URL Blocklist
  [Annoyances]
  DISABLE_ANNOYANCES_AI: EasyList – AI Widgets
  DISABLE_ANNOYANCES_COOKIES: EasyList/uBO – Cookie Notices
  DISABLE_ANNOYANCES_OVERLAYS: EasyList/uBO – Overlay Notices
  DISABLE_ANNOYANCES_SOCIAL: EasyList – Social Widgets
  DISABLE_ANNOYANCES_WIDGETS: EasyList – Chat Widgets
  DISABLE_ANNOYANCES_OTHERS: EasyList – Other Annoyances
  DISABLE_ANNOYANCES_NOTIFICATIONS: EasyList – Notifications
  [Miscellaneous]
  DISABLE_UBLOCK_EXPERIMENTAL: uBlock filters – Experimental
  DISABLE_UBOL_TESTS: uBO Lite Test Filters
  [Regions, languages]
  DISABLE_ALB_0: 🇦🇱al 🇽🇰xk: Adblock List for Albania
  DISABLE_ARA_0: 🇪🇬eg 🇸🇦sa 🇲🇦ma 🇩🇿dz: Liste AR
  DISABLE_BGR_0: 🇧🇬bg: Bulgarian Adblock list
  DISABLE_CHN_0: 🇨🇳cn 🇹🇼tw: AdGuard Chinese (中文)
  DISABLE_CZE_0: 🇨🇿cz 🇸🇰sk: EasyList Czech and Slovak
  DISABLE_DEU_0: 🇩🇪de 🇨🇭ch 🇦🇹at: EasyList Germany
  DISABLE_EST_0: 🇪🇪ee: Eesti saitidele kohandatud filter
  DISABLE_FIN_0: 🇫🇮fi: Adblock List for Finland
  DISABLE_FRA_0: 🇫🇷fr 🇧🇪be 🇨🇦ca: AdGuard Français
  DISABLE_GRC_0: 🇬🇷gr 🇨🇾cy: Greek AdBlock Filter
  DISABLE_HRV_0: 🇭🇷hr 🇷🇸rs: Dandelion Sprout's Serbo-Croatian filters
  DISABLE_HUN_0: 🇭🇺hu: hufilter
  DISABLE_IDN_0: 🇮🇩id 🇲🇾my: ABPindo
  DISABLE_IND_0: 🇮🇳in 🇱🇰lk 🇳🇵np: IndianList
  DISABLE_IRN_0: 🇮🇷ir: PersianBlocker
  DISABLE_ISL_0: 🇮🇸is: Icelandic ABP List
  DISABLE_ISR_0: 🇮🇱il: EasyList Hebrew
  DISABLE_ITA_0: 🇮🇹it: EasyList Italy
  DISABLE_JPN_1: 🇯🇵jp: AdGuard Japanese
  DISABLE_KOR_1: 🇰🇷kr: List-KR Classic
  DISABLE_LTU_0: 🇱🇹lt: EasyList Lithuania
  DISABLE_LVA_0: 🇱🇻lv: Latvian List
  DISABLE_MKD_0: 🇲🇰mk: Macedonian adBlock Filters
  DISABLE_NLD_0: 🇳🇱nl 🇧🇪be: AdGuard Dutch
  DISABLE_NOR_0: 🇳🇴no 🇩🇰dk 🇮🇸is: Dandelion Sprouts nordiske filtre
  DISABLE_POL_0: 🇵🇱pl: Oficjalne Polskie Filtry do uBlocka Origin
  DISABLE_POL_3: 🇵🇱pl: CERT.PL's Warning List
  DISABLE_ROU_1: 🇷🇴ro 🇲🇩md: Romanian Ad (ROad) Block List Light
  DISABLE_RUS_0: 🇷🇺ru 🇺🇦ua 🇺🇿uz 🇰🇿kz: RU AdList
  DISABLE_RUS_1: 🇷🇺ru 🇺🇦ua 🇺🇿uz 🇰🇿kz: RU AdList: Counters
  DISABLE_SPA_0: 🇪🇸es 🇦🇷ar 🇲🇽mx 🇨🇴co: EasyList Spanish
  DISABLE_SPA_1: 🇪🇸es 🇦🇷ar 🇧🇷br 🇵🇹pt: AdGuard Spanish/Portuguese
  DISABLE_SVN_0: 🇸🇮si: Slovenian List
  DISABLE_SWE_1: 🇸🇪se: Frellwit's Swedish Filter
  DISABLE_THA_0: 🇹🇭th: EasyList Thailand
  DISABLE_TUR_0: 🇹🇷tr: AdGuard Turkish
  DISABLE_UKR_0: 🇺🇦ua: AdGuard Ukrainian
  DISABLE_VIE_1: 🇻🇳vn: ABPVN List

env_schema:
  ENABLE_QUERY_CLEANING:
    name: "URL query cleaning"
    description: "Disable only query-parameter cleaning; native blocking stays enabled."
    default_value: "true"
    options:
      - "true"
      - "false"

rules:
  - rule_set:
      name: "uBlock filters – Ads, trackers, and more"
      match: "https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/dist/full/rulesets/ublock-filters.yaml"
      policy: "{{{BLOCK_POLICY}}}"
      update_interval: 86400
      disabled: {{{DISABLE_UBLOCK_FILTERS}}}
  - rule_set:
      name: "EasyList"
      match: "https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/dist/full/rulesets/easylist.yaml"
