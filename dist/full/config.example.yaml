# Add this single module reference to the Egern main configuration.
# Its 56 boolean compat_arguments are defined inside ubol.yaml.
modules:
  - name: "uBlock Origin Lite rules"
    url: "https://raw.githubusercontent.com/jiegebuy/egern-ubol/main/dist/full/ubol.yaml"
    enabled: true
    update_interval: 86400
    env:
      ENABLE_QUERY_CLEANING: "true"
