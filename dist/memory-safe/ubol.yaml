  "禁用浮层提示": true
  "禁用社交组件": true
  "禁用聊天组件": true
  "禁用其他烦扰": true
  "禁用通知提示": true
  "禁用uBlock实验规则": true
  "禁用uBOLite测试规则": true
  "禁用阿尔巴尼亚列表": true
  "禁用阿拉伯语列表": true
  "禁用保加利亚语列表": true
  "禁用AdGuard中文": false
