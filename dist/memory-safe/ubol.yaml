compat_arguments_desc: |
  所有“禁用…”参数：false 表示启用该列表，true 表示禁用。
  “拦截策略”控制所有已启用列表采用的 Egern 策略。
  [默认规则]
  禁用uBlock主规则: uBlock filters – Ads, trackers, and more（广告、跟踪器等基础过滤）
  禁用EasyList: EasyList（通用广告过滤）
  禁用EasyPrivacy: EasyPrivacy（隐私与跟踪器过滤）
  禁用PeterLowe: Peter Lowe – Ads, trackers, and more（广告与跟踪器过滤）
  [广告]
  禁用移动广告: AdGuard/uBO – Mobile Ads（移动端广告过滤）
  [隐私]
  禁用局域网入侵防护: Block Outsider Intrusion into LAN（阻止外部网络侵入局域网）
  禁用网址跟踪保护: AdGuard/uBO – URL Tracking Protection（移除网址跟踪与间谍参数）
  [恶意软件与安全]
  禁用uBlock恶意软件: uBlock filters – Badware risks（恶意软件风险过滤）
  禁用恶意网址列表: Malicious URL Blocklist（已知恶意网址拦截）
  [烦扰元素]
  禁用AI组件: EasyList – AI Widgets（网页 AI 小组件）
  禁用Cookie提示: EasyList/uBO – Cookie Notices（Cookie 同意提示）
  禁用浮层提示: EasyList/uBO – Overlay Notices（弹层与遮罩提示）
  禁用社交组件: EasyList – Social Widgets（社交分享与关注组件）
  禁用聊天组件: EasyList – Chat Widgets（网页聊天组件）
  禁用其他烦扰: EasyList – Other Annoyances（其他网页烦扰元素）
  禁用通知提示: EasyList – Notifications（网页通知请求与提示）
  [其他]
  禁用uBlock实验规则: uBlock filters – Experimental（实验性过滤规则）
  禁用uBOLite测试规则: uBO Lite Test Filters（uBO Lite 测试过滤器）
  [地区与语言]
  禁用阿尔巴尼亚列表: 🇦🇱al 🇽🇰xk: Adblock List for Albania（阿尔巴尼亚与科索沃地区）
  禁用阿拉伯语列表: 🇪🇬eg 🇸🇦sa 🇲🇦ma 🇩🇿dz: Liste AR（阿拉伯语地区）
  禁用保加利亚语列表: 🇧🇬bg: Bulgarian Adblock list（保加利亚语地区）
  禁用AdGuard中文: 🇨🇳cn 🇹🇼tw: AdGuard Chinese (中文)（中文网站）
  禁用捷克斯洛伐克列表: 🇨🇿cz 🇸🇰sk: EasyList Czech and Slovak（捷克语与斯洛伐克语地区）
  禁用EasyList德国: 🇩🇪de 🇨🇭ch 🇦🇹at: EasyList Germany（德语地区）
  禁用爱沙尼亚语列表: 🇪🇪ee: Eesti saitidele kohandatud filter（爱沙尼亚语地区）
  禁用芬兰语列表: 🇫🇮fi: Adblock List for Finland（芬兰语地区）
  禁用AdGuard法语: 🇫🇷fr 🇧🇪be 🇨🇦ca: AdGuard Français（法语地区）
  禁用希腊语列表: 🇬🇷gr 🇨🇾cy: Greek AdBlock Filter（希腊语地区）
  禁用塞尔维亚克罗地亚语: 🇭🇷hr 🇷🇸rs: Dandelion Sprout's Serbo-Croatian filters（塞尔维亚-克罗地亚语地区）
  禁用匈牙利语列表: 🇭🇺hu: hufilter（匈牙利语地区）
  禁用ABPindo: 🇮🇩id 🇲🇾my: ABPindo（印度尼西亚语与马来语地区）
  禁用IndianList: 🇮🇳in 🇱🇰lk 🇳🇵np: IndianList（印度、斯里兰卡与尼泊尔地区）
  禁用PersianBlocker: 🇮🇷ir: PersianBlocker（波斯语地区）
  禁用冰岛语列表: 🇮🇸is: Icelandic ABP List（冰岛语地区）
  禁用EasyList希伯来语: 🇮🇱il: EasyList Hebrew（希伯来语地区）
  禁用EasyList意大利: 🇮🇹it: EasyList Italy（意大利语地区）
  禁用AdGuard日语: 🇯🇵jp: AdGuard Japanese（日语地区）
  禁用ListKRClassic: 🇰🇷kr: List-KR Classic（韩语地区）
  禁用EasyList立陶宛: 🇱🇹lt: EasyList Lithuania（立陶宛语地区）
  禁用拉脱维亚语列表: 🇱🇻lv: Latvian List（拉脱维亚语地区）
  禁用马其顿语列表: 🇲🇰mk: Macedonian adBlock Filters（马其顿语地区）
  禁用AdGuard荷兰语: 🇳🇱nl 🇧🇪be: AdGuard Dutch（荷兰语地区）
  禁用北欧语列表: 🇳🇴no 🇩🇰dk 🇮🇸is: Dandelion Sprouts nordiske filtre（挪威、丹麦与冰岛地区）
  禁用波兰语官方列表: 🇵🇱pl: Oficjalne Polskie Filtry do uBlocka Origin（uBlock Origin 波兰语过滤）
  禁用CERTPL威胁列表: 🇵🇱pl: CERT.PL's Warning List（CERT.PL 安全威胁过滤）
  禁用罗马尼亚语列表: 🇷🇴ro 🇲🇩md: Romanian Ad (ROad) Block List Light（罗马尼亚语与摩尔多瓦地区）
  禁用RUAdList: 🇷🇺ru 🇺🇦ua 🇺🇿uz 🇰🇿kz: RU AdList（俄语及周边地区）
  禁用RUAdList计数器: 🇷🇺ru 🇺🇦ua 🇺🇿uz 🇰🇿kz: RU AdList: Counters（俄语网站计数器过滤）
  禁用EasyList西班牙语: 🇪🇸es 🇦🇷ar 🇲🇽mx 🇨🇴co: EasyList Spanish（西班牙语地区）
  禁用AdGuard西葡语: 🇪🇸es 🇦🇷ar 🇧🇷br 🇵🇹pt: AdGuard Spanish/Portuguese（西班牙语与葡萄牙语地区）
  禁用斯洛文尼亚语列表: 🇸🇮si: Slovenian List（斯洛文尼亚语地区）
  禁用瑞典语列表: 🇸🇪se: Frellwit's Swedish Filter（瑞典语地区）
