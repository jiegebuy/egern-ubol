name: "uBlock Origin Lite 规则"
description: "一个 Egern 模块，包含 56 个可独立配置的 uBO Lite 2026.729.1529 过滤列表开关（内存安全，仅域名/IP）。"
author: "Raymond Hill 与各上游过滤列表维护者"
homepage: "https://github.com/uBlockOrigin/uBOL-home"
manual: "https://github.com/uBlockOrigin/uBOL-home"
icon: "shield.lefthalf.filled"

compat_arguments:
  "拦截策略": "REJECT"
  "禁用uBlock主规则": false
  "禁用EasyList": false
  "禁用EasyPrivacy": false
  "禁用PeterLowe": false
  "禁用移动广告": true
  "禁用局域网入侵防护": true
  "禁用网址跟踪保护": false
