  "禁用PersianBlocker": true
  "禁用冰岛语列表": true
  "禁用EasyList希伯来语": true
  "禁用EasyList意大利": true
  "禁用AdGuard日语": true
  "禁用ListKRClassic": true
  "禁用EasyList立陶宛": true
  "禁用拉脱维亚语列表": true
  "禁用马其顿语列表": true
  "禁用AdGuard荷兰语": true
  "禁用北欧语列表": true
  "禁用波兰语官方列表": true
  "禁用CERTPL威胁列表": true
