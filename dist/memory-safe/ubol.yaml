  禁用ABPVN: 🇻🇳vn: ABPVN List（越南语地区）

env_schema:
  ENABLE_QUERY_CLEANING:
    name: "URL 查询参数清理"
    description: "关闭后仅停用 URL 查询参数清理，原生拦截规则不受影响。"
    default_value: "true"
    options:
      - "true"
      - "false"

